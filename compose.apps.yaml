x-service-environment: &service-environment
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  AUTH_ISSUER: ${AUTH_ISSUER:-https://auth.snabbit.local}
  GOOGLE_IDENTITY_VERIFIER: ${GOOGLE_IDENTITY_VERIFIER:-google}
  GOOGLE_CUSTOMER_CLIENT_IDS: ${GOOGLE_CUSTOMER_CLIENT_IDS:-}
  GOOGLE_WORKER_CLIENT_IDS: ${GOOGLE_WORKER_CLIENT_IDS:-}
  AUTH_REFRESH_IDLE_TTL: ${AUTH_REFRESH_IDLE_TTL:-P180D}
  AUTH_REFRESH_ABSOLUTE_TTL: ${AUTH_REFRESH_ABSOLUTE_TTL:-}
  AUTH_REFRESH_GRACE_WINDOW: ${AUTH_REFRESH_GRACE_WINDOW:-PT10S}
  AUTH_MAX_ACTIVE_SESSIONS: ${AUTH_MAX_ACTIVE_SESSIONS:-10}
  AUTH_ACCOUNT_RATE_LIMIT: ${AUTH_ACCOUNT_RATE_LIMIT:-20}
  AUTH_ACCOUNT_RATE_WINDOW: ${AUTH_ACCOUNT_RATE_WINDOW:-PT1M}
  AUTH_WORKER_SELECTION_TTL: ${AUTH_WORKER_SELECTION_TTL:-PT5M}
  GATEWAY_RATE_LIMIT_PER_SECOND: ${GATEWAY_RATE_LIMIT_PER_SECOND:-20}
  GATEWAY_RATE_LIMIT_BURST: ${GATEWAY_RATE_LIMIT_BURST:-40}
  OTP_PEPPER: ${OTP_PEPPER:?Set OTP_PEPPER in .env}
  SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN:?Set SERVICE_AUTH_TOKEN in .env}
  USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8081}
  BOOKING_SERVICE_URL: ${BOOKING_SERVICE_URL:-http://booking-service:8082}
  WORKER_SERVICE_URL: ${WORKER_SERVICE_URL:-http://worker-service:8083}
  WALLET_SERVICE_URL: ${WALLET_SERVICE_URL:-http://wallet-service:8084}
  SUPPORT_SERVICE_URL: ${SUPPORT_SERVICE_URL:-http://support-service:8085}
  NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:8086}
  DEV_SEED_ENABLED: ${DEV_SEED_ENABLED:-false}
  DEV_SEED_BOOKING_WINDOW_DAYS: ${DEV_SEED_BOOKING_WINDOW_DAYS:-10}
  DEV_SEED_MARGIN_DAYS: ${DEV_SEED_MARGIN_DAYS:-2}
  DEV_SEED_AUTO_ACCEPT_OFFERS: ${DEV_SEED_AUTO_ACCEPT_OFFERS:-false}
  DEV_SEED_AUTO_ACCEPT_DELAY_MS: ${DEV_SEED_AUTO_ACCEPT_DELAY_MS:-1500}
  DEV_SEED_AUTO_PROGRESS: ${DEV_SEED_AUTO_PROGRESS:-false}
  DEV_SEED_AUTO_PROGRESS_EN_ROUTE_DELAY_MS: ${DEV_SEED_AUTO_PROGRESS_EN_ROUTE_DELAY_MS:-1500}
  DEV_SEED_AUTO_PROGRESS_ARRIVAL_DELAY_MS: ${DEV_SEED_AUTO_PROGRESS_ARRIVAL_DELAY_MS:-3000}
  DEV_SEED_AUTOMATION_SCAN_DELAY_MS: ${DEV_SEED_AUTOMATION_SCAN_DELAY_MS:-500}

x-service-common: &service-common
  restart: unless-stopped
  networks: [default]

services:
  kafka:
    environment:
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

  user-service:
    <<: *service-common
    build:
      context: .
      args: { SERVICE: user-service }
    ports: ["127.0.0.1:8081:8081"]
    environment:
      <<: *service-environment
      USER_DB_URL: jdbc:postgresql://user-db:5432/users
      USER_DB_USERNAME: ${USER_DB_USERNAME:-snabbit}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in .env}
      OTP_PROVIDER: ${OTP_PROVIDER:-twilio-verify}
      OTP_EXPOSE_CODE: ${OTP_EXPOSE_CODE:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID:-}
      TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      FAVOURITES_MAX_COUNT: ${FAVOURITES_MAX_COUNT:-3}
      FAVOURITES_REQUIRE_COMPLETED_VISIT: ${FAVOURITES_REQUIRE_COMPLETED_VISIT:-true}
      DEV_SEED_DEMO_CUSTOMER_EMAIL: ${DEV_SEED_DEMO_CUSTOMER_EMAIL:-}
      DEV_SEED_DEMO_CUSTOMER_NAME: ${DEV_SEED_DEMO_CUSTOMER_NAME:-Demo Customer}
      DEV_SEED_PLUS_VALIDITY_DAYS: ${DEV_SEED_PLUS_VALIDITY_DAYS:-365}
      DEV_SEED_PLUS_EXTEND_WHEN_DAYS_REMAIN: ${DEV_SEED_PLUS_EXTEND_WHEN_DAYS_REMAIN:-30}
    depends_on:
      user-db: { condition: service_healthy }
      redis: { condition: service_started }
      kafka: { condition: service_started }

  booking-service:
    <<: *service-common
    build:
      context: .
      args: { SERVICE: booking-service }
    ports: ["127.0.0.1:8082:8082"]
    environment:
      <<: *service-environment
      BOOKING_DB_URL: jdbc:postgresql://booking-db:5432/bookings
      BOOKING_DB_USERNAME: ${BOOKING_DB_USERNAME:-snabbit}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?Set BOOKING_DB_PASSWORD in .env}
      BOOKING_OPENING_TIME: ${BOOKING_OPENING_TIME:-08:00}
      BOOKING_CLOSING_TIME: ${BOOKING_CLOSING_TIME:-19:00}
      ARRIVAL_OTP_PROVIDER: ${ARRIVAL_OTP_PROVIDER:-twilio-verify}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID:-}
      TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET:-}
      ARRIVAL_TWILIO_VERIFY_SERVICE_SID: ${ARRIVAL_TWILIO_VERIFY_SERVICE_SID:-${TWILIO_VERIFY_SERVICE_SID:-}}
    depends_on:
      booking-db: { condition: service_healthy }
      redis: { condition: service_started }
      kafka: { condition: service_started }

  worker-service:
    <<: *service-common
    build:
      context: .
      args: { SERVICE: worker-service }
    ports: ["127.0.0.1:8083:8083"]
    environment:
      <<: *service-environment
      WORKER_DB_URL: jdbc:postgresql://worker-db:5432/workers
      WORKER_DB_USERNAME: ${WORKER_DB_USERNAME:-snabbit}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?Set WORKER_DB_PASSWORD in .env}
      WORKER_VETERAN_MONTHS: ${WORKER_VETERAN_MONTHS:-6}
      WORKER_EXPERT_MONTHS: ${WORKER_EXPERT_MONTHS:-9}
      WORKER_STANDARD_SURCHARGE_MINOR: ${WORKER_STANDARD_SURCHARGE_MINOR:-0}
      WORKER_VETERAN_SURCHARGE_MINOR: ${WORKER_VETERAN_SURCHARGE_MINOR:-3000}
      WORKER_EXPERT_SURCHARGE_MINOR: ${WORKER_EXPERT_SURCHARGE_MINOR:-5000}
      WORKER_RATING_UPDATE_WINDOW: ${WORKER_RATING_UPDATE_WINDOW:-PT24H}
      WORKER_RANK_PRIOR_MEAN: ${WORKER_RANK_PRIOR_MEAN:-4.5}
      WORKER_RANK_PRIOR_WEIGHT: ${WORKER_RANK_PRIOR_WEIGHT:-20}
      DEV_SEED_LATITUDE: ${DEV_SEED_LATITUDE:-19.076090}
      DEV_SEED_LONGITUDE: ${DEV_SEED_LONGITUDE:-72.877426}
      DEV_SEED_SERVICE_RADIUS_KM: ${DEV_SEED_SERVICE_RADIUS_KM:-50.00}
      DEV_SEED_WORKER_LOGIN_EMAIL: ${DEV_SEED_WORKER_LOGIN_EMAIL:-}
    depends_on:
      worker-db: { condition: service_healthy }
      redis: { condition: service_started }
      kafka: { condition: service_started }

  wallet-service:
    <<: *service-common
    build:
      context: .
      args: { SERVICE: wallet-service }
    ports: ["127.0.0.1:8084:8084"]
    environment:
      <<: *service-environment
      WALLET_DB_URL: jdbc:postgresql://wallet-db:5432/wallets
      WALLET_DB_USERNAME: ${WALLET_DB_USERNAME:-snabbit}
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD:?Set WALLET_DB_PASSWORD in .env}
      RAZORPAY_MODE: ${RAZORPAY_MODE:-fake}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:?Set RAZORPAY_WEBHOOK_SECRET in .env}
    depends_on:
      wallet-db: { condition: service_healthy }
      kafka: { condition: service_started }

  support-service:
    <<: *service-common
    build:
      context: .
      args: { SERVICE: support-service }
    ports: ["127.0.0.1:8085:8085"]
    environment:
      <<: *service-environment
      SUPPORT_DB_URL: jdbc:postgresql://support-db:5432/support
      SUPPORT_DB_USERNAME: ${SUPPORT_DB_USERNAME:-snabbit}
      SUPPORT_DB_PASSWORD: ${SUPPORT_DB_PASSWORD:?Set SUPPORT_DB_PASSWORD in .env}
    depends_on:
      support-db: { condition: service_healthy }

  notification-service:
    <<: *service-common
    build:
      context: .
      args: { SERVICE: notification-service }
    ports: ["127.0.0.1:8086:8086"]
    environment:
      <<: *service-environment
      NOTIFICATION_DB_URL: jdbc:postgresql://notification-db:5432/notifications
      NOTIFICATION_DB_USERNAME: ${NOTIFICATION_DB_USERNAME:-snabbit}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD in .env}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-logging}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-}
      FCM_BASE_URL: ${FCM_BASE_URL:-https://fcm.googleapis.com}
    depends_on:
      notification-db: { condition: service_healthy }
      kafka: { condition: service_started }

  api-gateway:
    <<: *service-common
    build:
      context: .
      args: { SERVICE: api-gateway }
    ports: ["127.0.0.1:8080:8080"]
    environment:
      <<: *service-environment
    depends_on:
      user-service: { condition: service_started }
      booking-service: { condition: service_started }
      worker-service: { condition: service_started }
      wallet-service: { condition: service_started }
      support-service: { condition: service_started }
      notification-service: { condition: service_started }
