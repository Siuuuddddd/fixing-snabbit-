server:
  port: 8082
spring:
  profiles:
    default: local
  application:
    name: booking-service
  datasource:
    url: ${BOOKING_DB_URL:jdbc:postgresql://localhost:5434/bookings}
    username: ${BOOKING_DB_USERNAME:snabbit}
    password: ${BOOKING_DB_PASSWORD:snabbit-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data.redis.host: ${REDIS_HOST:localhost}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true

dev-seed:
  enabled: ${DEV_SEED_ENABLED:false}
  booking-window-days: ${DEV_SEED_BOOKING_WINDOW_DAYS:10}
  margin-days: ${DEV_SEED_MARGIN_DAYS:2}
  auto-accept-offers: ${DEV_SEED_AUTO_ACCEPT_OFFERS:false}
  auto-accept-delay-ms: ${DEV_SEED_AUTO_ACCEPT_DELAY_MS:1500}
  auto-progress: ${DEV_SEED_AUTO_PROGRESS:false}
  auto-progress-en-route-delay-ms: ${DEV_SEED_AUTO_PROGRESS_EN_ROUTE_DELAY_MS:1500}
  auto-progress-arrival-delay-ms: ${DEV_SEED_AUTO_PROGRESS_ARRIVAL_DELAY_MS:3000}

dev-simulation:
  enabled: ${DEV_SIMULATION_ENABLED:false}
  scan-delay-ms: ${DEV_SIMULATION_SCAN_DELAY_MS:5000}

dev:
  arrival-delay-seconds: ${DEV_ARRIVAL_DELAY_SECONDS:120}
  auto-complete-delay-seconds: ${DEV_AUTO_COMPLETE_DELAY_SECONDS:180}
  multi-day-arrival-mode: ${DEV_MULTI_DAY_ARRIVAL_MODE:SEQUENTIAL}
  automation-scan-delay-ms: ${DEV_SEED_AUTOMATION_SCAN_DELAY_MS:500}

booking:
  zone-id: Asia/Kolkata
  opening-time: ${BOOKING_OPENING_TIME:08:00}
  closing-time: ${BOOKING_CLOSING_TIME:19:00}
  slot-hold-duration: PT5M
  worker-offer-duration: PT1M
  expiry-scan-delay: PT30S
  expiry-batch-size: 100
  advance-window-days: ${BOOKING_ADVANCE_WINDOW_DAYS:10}
  min-multi-day-visits: ${BOOKING_MIN_MULTI_DAY_VISITS:2}
  max-multi-day-visits: ${BOOKING_MAX_MULTI_DAY_VISITS:${BOOKING_ADVANCE_WINDOW_DAYS:10}}
  minimum-lead-time: ${BOOKING_MINIMUM_LEAD_TIME:PT0S}
  payment-hold-extension: ${BOOKING_PAYMENT_HOLD_EXTENSION:PT10M}
  maximum-total-hold-time: ${BOOKING_MAXIMUM_TOTAL_HOLD_TIME:PT20M}
  plus-veteran-upgrade-free: ${BOOKING_PLUS_VETERAN_UPGRADE_FREE:true}
  arrival-accuracy-meters: 100
  arrival-radius-meters: 200
  arrival-otp:
    required: ${ARRIVAL_OTP_REQUIRED:true}
    expiry: ${ARRIVAL_OTP_EXPIRY:PT5M}
    max-attempts: ${ARRIVAL_OTP_MAX_ATTEMPTS:5}
    resend-cooldown: ${ARRIVAL_OTP_RESEND_COOLDOWN:PT30S}
    max-sends: ${ARRIVAL_OTP_MAX_SENDS:3}
    verification-rate-window: ${ARRIVAL_OTP_VERIFICATION_RATE_WINDOW:PT1M}
    max-verification-requests-per-visit: ${ARRIVAL_OTP_MAX_VERIFY_PER_VISIT:10}
    max-verification-requests-per-worker: ${ARRIVAL_OTP_MAX_VERIFY_PER_WORKER:20}

arrival-otp-provider:
  provider: ${ARRIVAL_OTP_PROVIDER:stub}
  base-url: ${ARRIVAL_OTP_BASE_URL:https://verify.twilio.com}
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  api-key-sid: ${TWILIO_API_KEY_SID:}
  api-key-secret: ${TWILIO_API_KEY_SECRET:}
  verify-service-sid: ${ARRIVAL_TWILIO_VERIFY_SERVICE_SID:${TWILIO_VERIFY_SERVICE_SID:}}

cancellation:
  late-window: PT2H
  early-fee-minor: 5000
  late-fee-minor: 10000
  plus-fee-discount-percent: 50

eventing:
  outbox-enabled: true
  outbox-topic: booking-events
  consumer-topic: wallet-events
  consumer-group: booking-service
  outbox-poll-delay: PT1S
  outbox-claim-duration: PT30S
  outbox-batch-size: 50

integrations:
  user-service-url: ${USER_SERVICE_URL:http://localhost:8081}
  worker-service-url: ${WORKER_SERVICE_URL:http://localhost:8083}
  wallet-service-url: ${WALLET_SERVICE_URL:http://localhost:8084}

service-auth:
  token: ${SERVICE_AUTH_TOKEN:local-only-service-token-change-me-1234567890}

deployment.production.required-properties:
  - spring.datasource.url
  - spring.datasource.password
  - spring.data.redis.host
  - spring.kafka.bootstrap-servers
  - integrations.user-service-url
  - integrations.worker-service-url
  - integrations.wallet-service-url
  - service-auth.token
  - arrival-otp-provider.provider
  - arrival-otp-provider.account-sid
  - arrival-otp-provider.api-key-sid
  - arrival-otp-provider.api-key-secret
  - arrival-otp-provider.verify-service-sid

tracking:
  visibility-lead-time: PT2H
  poll-interval: PT5S
  max-location-age: PT2M
