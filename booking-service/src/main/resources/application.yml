server:
  port: 8082
spring:
  application:
    name: booking-service
  datasource:
    url: ${BOOKING_DB_URL:jdbc:postgresql://localhost:5434/bookings}
    username: ${BOOKING_DB_USERNAME:snabbit}
    password: ${BOOKING_DB_PASSWORD:snabbit-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data.redis.host: ${REDIS_HOST:localhost}
  kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true

booking:
  zone-id: Asia/Kolkata
  opening-time: "08:00"
  closing-time: "19:00"
  slot-hold-duration: PT5M
  worker-offer-duration: PT1M
  expiry-scan-delay: PT30S
  expiry-batch-size: 100
