server:
  port: 8082
spring:
  application:
    name: booking-service
  datasource:
    url: ${BOOKING_DB_URL:jdbc:postgresql://localhost:5434/bookings}
    username: ${BOOKING_DB_USERNAME:snabbit}
    password: ${BOOKING_DB_PASSWORD:snabbit-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data.redis.host: ${REDIS_HOST:localhost}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true

booking:
  zone-id: Asia/Kolkata
  opening-time: "08:00"
  closing-time: "19:00"
  slot-hold-duration: PT5M
  worker-offer-duration: PT1M
  expiry-scan-delay: PT30S
  expiry-batch-size: 100
  arrival-accuracy-meters: 100
  arrival-radius-meters: 250

cancellation:
  late-window: PT2H
  early-fee-minor: 5000
  late-fee-minor: 10000
  plus-fee-discount-percent: 50

eventing:
  outbox-enabled: true
  outbox-topic: booking-events
  consumer-topic: wallet-events
  consumer-group: booking-service
  outbox-poll-delay: PT1S
  outbox-claim-duration: PT30S
  outbox-batch-size: 50

integrations:
  user-service-url: ${USER_SERVICE_URL:http://localhost:8081}
  worker-service-url: ${WORKER_SERVICE_URL:http://localhost:8083}
  wallet-service-url: ${WALLET_SERVICE_URL:http://localhost:8084}

service-auth:
  token: ${SERVICE_AUTH_TOKEN:local-only-service-token-change-me-1234567890}
