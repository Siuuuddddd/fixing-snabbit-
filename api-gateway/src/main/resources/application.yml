server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_PER_SECOND:20}
            redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST:40}
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@gatewayRateLimitKeyResolver}"
      routes:
        - id: auth
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates: [Path=/api/v1/auth/**]
        - id: worker-auth
          uri: ${WORKER_SERVICE_URL:http://localhost:8083}
          predicates: [Path=/api/v1/worker-auth/**]
        - id: staff-auth
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates: [Path=/api/v1/staff-auth/**]
        - id: staff-support
          uri: ${SUPPORT_SERVICE_URL:http://localhost:8085}
          predicates: [Path=/api/v1/staff/support/**]
        - id: staff-operations
          uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
          predicates: [Path=/api/v1/staff/operations/**]
        - id: staff-finance
          uri: ${WALLET_SERVICE_URL:http://localhost:8084}
          predicates: [Path=/api/v1/staff/finance/**]
        - id: worker-bookings
          uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
          predicates: [Path=/api/v1/worker/bookings/**]
        - id: worker-notifications
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
          predicates: [Path=/api/v1/worker/notifications/**]
        - id: customer-ratings
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates: [Path=/api/v1/worker/ratings/customers/**]
        - id: worker-ratings
          uri: ${WORKER_SERVICE_URL:http://localhost:8083}
          predicates: [Path=/api/v1/ratings/workers/**]
        - id: users
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates: [Path=/api/v1/users/**]
        - id: bookings
          uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
          predicates: [Path=/api/v1/bookings/**]
        - id: services
          uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
          predicates: [Path=/api/v1/services/**]
        - id: workers
          uri: ${WORKER_SERVICE_URL:http://localhost:8083}
          predicates: [Path=/api/v1/workers/**]
        - id: wallets
          uri: ${WALLET_SERVICE_URL:http://localhost:8084}
          predicates: [Path=/api/v1/wallets/**]
        - id: support
          uri: ${SUPPORT_SERVICE_URL:http://localhost:8085}
          predicates: [Path=/api/v1/support/**]
        - id: notifications
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
          predicates: [Path=/api/v1/notifications/**]
        - id: razorpay-webhook
          uri: ${WALLET_SERVICE_URL:http://localhost:8084}
          predicates: [Path=/webhooks/razorpay]
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

auth:
  issuer: https://auth.snabbit.local
  jwt-secret: ${JWT_SECRET:local-only-change-me-32-byte-secret}
