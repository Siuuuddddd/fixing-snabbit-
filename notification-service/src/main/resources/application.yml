server:
  port: 8086
spring:
  profiles:
    default: local
  application:
    name: notification-service
  main:
    web-application-type: reactive
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5438/notifications}
    username: ${NOTIFICATION_DB_USERNAME:snabbit}
    password: ${NOTIFICATION_DB_PASSWORD:snabbit-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true

integrations:
  booking-service-url: ${BOOKING_SERVICE_URL:http://localhost:8082}
  wallet-service-url: ${WALLET_SERVICE_URL:http://localhost:8084}
  user-service-url: ${USER_SERVICE_URL:http://localhost:8081}
  worker-service-url: ${WORKER_SERVICE_URL:http://localhost:8083}

service-auth:
  token: ${SERVICE_AUTH_TOKEN:local-only-service-token-change-me-1234567890}

sms:
  enabled: true
  provider: ${SMS_PROVIDER:twilio}
  base-url: ${TWILIO_BASE_URL:https://api.twilio.com}
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  from-number: ${TWILIO_FROM_NUMBER:}

deployment.production.required-properties:
  - spring.datasource.url
  - spring.datasource.password
  - spring.kafka.bootstrap-servers
  - integrations.booking-service-url
  - integrations.wallet-service-url
  - integrations.user-service-url
  - integrations.worker-service-url
  - service-auth.token
  - sms.provider
  - sms.account-sid
  - sms.auth-token
  - sms.from-number
  - notifications.push.provider
  - notifications.push.fcm.project-id
  - notifications.push.fcm.service-account-file

notifications:
  consumer-group: notification-service
  booking-topic: booking-events
  wallet-topic: wallet-events
  stream-poll-delay: PT1S
  delivery-poll-delay: PT5S
  delivery-claim-duration: PT30S
  delivery-batch-size: 50
  delivery-max-attempts: 5
  push:
    provider: ${PUSH_PROVIDER:fcm}
    fcm:
      project-id: ${FCM_PROJECT_ID:}
      service-account-file: ${FCM_SERVICE_ACCOUNT_FILE:}
      base-url: ${FCM_BASE_URL:https://fcm.googleapis.com}
