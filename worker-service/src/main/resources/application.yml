server:
  port: 8083
spring:
  profiles:
    default: local
  application:
    name: worker-service
  datasource:
    url: ${WORKER_DB_URL:jdbc:postgresql://localhost:5435/workers}
    username: ${WORKER_DB_USERNAME:snabbit}
    password: ${WORKER_DB_PASSWORD:snabbit-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true

worker:
  local-seed-days: ${WORKER_LOCAL_SEED_DAYS:10}
  booking-window-days: ${WORKER_BOOKING_WINDOW_DAYS:10}
  tiers:
    veteran-months: ${WORKER_VETERAN_MONTHS:6}
    expert-months: ${WORKER_EXPERT_MONTHS:9}
    zone-id: Asia/Kolkata
    standard-surcharge-minor: ${WORKER_STANDARD_SURCHARGE_MINOR:0}
    veteran-surcharge-minor: ${WORKER_VETERAN_SURCHARGE_MINOR:3000}
    expert-surcharge-minor: ${WORKER_EXPERT_SURCHARGE_MINOR:5000}
  ratings:
    update-window: ${WORKER_RATING_UPDATE_WINDOW:PT24H}
    prior-mean: ${WORKER_RANK_PRIOR_MEAN:4.5}
    prior-weight: ${WORKER_RANK_PRIOR_WEIGHT:20}

dev-seed:
  enabled: ${DEV_SEED_ENABLED:false}
  booking-window-days: ${DEV_SEED_BOOKING_WINDOW_DAYS:10}
  margin-days: ${DEV_SEED_MARGIN_DAYS:2}
  latitude: ${DEV_SEED_LATITUDE:19.076090}
  longitude: ${DEV_SEED_LONGITUDE:72.877426}
  service-radius-km: ${DEV_SEED_SERVICE_RADIUS_KM:50.00}
  worker-login-email: ${DEV_SEED_WORKER_LOGIN_EMAIL:}

auth:
  issuer: ${AUTH_ISSUER:https://auth.snabbit.local}
  jwt-secret: ${JWT_SECRET:local-only-change-me-32-byte-secret}
  google:
    verifier: ${GOOGLE_IDENTITY_VERIFIER:google}
    customer-client-ids: ${GOOGLE_CUSTOMER_CLIENT_IDS:}
    worker-client-ids: ${GOOGLE_WORKER_CLIENT_IDS:}
  access-token-ttl: PT15M
  refresh-idle-ttl: ${AUTH_REFRESH_IDLE_TTL:P180D}
  refresh-absolute-ttl: ${AUTH_REFRESH_ABSOLUTE_TTL:}
  refresh-grace-window: ${AUTH_REFRESH_GRACE_WINDOW:PT10S}
  max-active-sessions: ${AUTH_MAX_ACTIVE_SESSIONS:10}
  account-rate-limit: ${AUTH_ACCOUNT_RATE_LIMIT:20}
  account-rate-window: ${AUTH_ACCOUNT_RATE_WINDOW:PT1M}
  shared-selection-token-ttl: ${AUTH_WORKER_SELECTION_TTL:PT5M}

integrations:
  booking-service-url: ${BOOKING_SERVICE_URL:http://localhost:8082}

service-auth:
  token: ${SERVICE_AUTH_TOKEN:local-only-service-token-change-me-1234567890}

worker-eventing:
  topic: worker-events
  poll-delay: PT1S
  claim-duration: PT30S
  batch-size: 50

deployment.production.required-properties:
  - spring.datasource.url
  - spring.datasource.password
  - spring.data.redis.host
  - spring.kafka.bootstrap-servers
  - auth.issuer
  - auth.jwt-secret
  - auth.google.verifier
  - auth.google.worker-client-ids
  - integrations.booking-service-url
  - service-auth.token
