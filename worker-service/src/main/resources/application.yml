server:
  port: 8083
spring:
  application:
    name: worker-service
  datasource:
    url: ${WORKER_DB_URL:jdbc:postgresql://localhost:5435/workers}
    username: ${WORKER_DB_USERNAME:snabbit}
    password: ${WORKER_DB_PASSWORD:snabbit-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
