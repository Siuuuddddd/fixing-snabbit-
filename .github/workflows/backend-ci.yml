name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6

      - name: Reject committed credentials and malformed patches
        shell: bash
        run: |
          credential_pattern='github''_pat_|gh''p_|sk''_live_|rzp''_live_|BE''GIN (RSA |EC |OPENSSH )?PRIVATE KEY'
          if git grep -nE "$credential_pattern" -- .; then
            echo "A credential-like value is committed in the repository"
            exit 1
          fi
          git log --check --oneline -20

      - name: Verify Docker for integration tests
        run: docker info

      - name: Validate full-stack Compose topology
        run: docker compose -f compose.yaml -f compose.apps.yaml config --quiet

      - name: Test and package every service
        run: ./gradlew build --no-daemon --stacktrace

      - name: Require all tests to run
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = list(Path(".").glob("*/build/test-results/test/TEST-*.xml"))
          if not reports:
              raise SystemExit("No JUnit XML reports were produced")

          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for report in reports:
              suite = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(suite.attrib.get(key, 0))

          print("Test totals:", totals)
          if totals["failures"] or totals["errors"] or totals["skipped"]:
              raise SystemExit("CI requires zero failed, errored, or skipped tests")
          PY

      - name: Upload test reports after failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: junit-reports
          path: "*/build/test-results/test/**"
          if-no-files-found: ignore
          retention-days: 7

