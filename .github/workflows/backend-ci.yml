name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Docker for integration tests
        run: docker info

      - name: Test and package every service
        run: ./gradlew build --no-daemon --stacktrace

      - name: Require all tests to run
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = list(Path(".").glob("*/build/test-results/test/TEST-*.xml"))
          if not reports:
              raise SystemExit("No JUnit XML reports were produced")

          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for report in reports:
              suite = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(suite.attrib.get(key, 0))

          print("Test totals:", totals)
          if totals["failures"] or totals["errors"] or totals["skipped"]:
              raise SystemExit("CI requires zero failed, errored, or skipped tests")
          PY

      - name: Upload test reports after failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: junit-reports
          path: "*/build/test-results/test/**"
          if-no-files-found: ignore
          retention-days: 7

