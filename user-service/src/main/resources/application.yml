server:
  port: 8081
spring:
  profiles:
    default: local
  application:
    name: user-service
  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://localhost:5433/users}
    username: ${USER_DB_USERNAME:snabbit}
    password: ${USER_DB_PASSWORD:snabbit-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true

auth:
  issuer: https://auth.snabbit.local
  jwt-secret: ${JWT_SECRET:local-only-change-me-32-byte-secret}
  otp-pepper: ${OTP_PEPPER:local-only-otp-pepper}
  otp-ttl: PT5M
  request-cooldown: PT1M
  access-token-ttl: PT15M
  max-attempts: 5
  expose-code: ${OTP_EXPOSE_CODE:false}

integrations:
  booking-service-url: ${BOOKING_SERVICE_URL:http://localhost:8082}
  wallet-service-url: ${WALLET_SERVICE_URL:http://localhost:8084}

service-auth:
  token: ${SERVICE_AUTH_TOKEN:local-only-service-token-change-me-1234567890}

sms:
  enabled: true
  provider: ${SMS_PROVIDER:twilio}
  base-url: ${TWILIO_BASE_URL:https://api.twilio.com}
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  from-number: ${TWILIO_FROM_NUMBER:}

geocoding:
  provider: ${GEOCODING_PROVIDER:disabled}
  base-url: ${GEOCODING_BASE_URL:https://maps.googleapis.com}
  api-key: ${GEOCODING_API_KEY:}
  maximum-mismatch-meters: ${GEOCODING_MAXIMUM_MISMATCH_METERS:250}

user-eventing:
  topic: user-events
  poll-delay: PT1S
  claim-duration: PT30S
  batch-size: 50

deployment.production.required-properties:
  - spring.datasource.url
  - spring.datasource.password
  - spring.data.redis.host
  - spring.kafka.bootstrap-servers
  - auth.issuer
  - auth.jwt-secret
  - auth.otp-pepper
  - integrations.booking-service-url
  - integrations.wallet-service-url
  - service-auth.token
  - sms.provider
  - sms.account-sid
  - sms.auth-token
  - sms.from-number
  - geocoding.provider
  - geocoding.api-key

plus-events:
  consumer-topic: booking-events
  consumer-group: user-service-plus

plus:
  reconciliation-delay: PT1M
  plans:
    monthly:
      price-minor: 19900
      duration-days: 30
      pass-count: 4
      pass-discount-minor: 3000
      service-code: null

plus-purchase-events:
  consumer-topic: wallet-events
  consumer-group: user-service-plus-purchases
