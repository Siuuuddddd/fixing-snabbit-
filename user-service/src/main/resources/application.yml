server:
  port: 8081
spring:
  application:
    name: user-service
  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://localhost:5433/users}
    username: ${USER_DB_USERNAME:snabbit}
    password: ${USER_DB_PASSWORD:snabbit-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true

auth:
  issuer: https://auth.snabbit.local
  jwt-secret: ${JWT_SECRET:local-only-change-me-32-byte-secret}
  otp-pepper: ${OTP_PEPPER:local-only-otp-pepper}
  otp-ttl: PT5M
  request-cooldown: PT1M
  access-token-ttl: PT15M
  max-attempts: 5
  expose-code: ${OTP_EXPOSE_CODE:false}

integrations:
  booking-service-url: ${BOOKING_SERVICE_URL:http://localhost:8082}

plus-events:
  consumer-topic: booking-events
  consumer-group: user-service-plus

plus:
  reconciliation-delay: PT1M
