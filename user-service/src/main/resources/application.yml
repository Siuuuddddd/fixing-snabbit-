server:
  port: 8081
spring:
  profiles:
    default: local
  application:
    name: user-service
  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://localhost:5433/users}
    username: ${USER_DB_USERNAME:snabbit}
    password: ${USER_DB_PASSWORD:snabbit-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
  mail:
    host: ${SMTP_HOST:mailpit}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_TLS_ENABLED:false}
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true

dev-seed:
  enabled: ${DEV_SEED_ENABLED:false}
  demo-customer-email: ${DEV_SEED_DEMO_CUSTOMER_EMAIL:}
  demo-customer-phone: ${DEV_SEED_DEMO_CUSTOMER_PHONE:}
  demo-customer-name: ${DEV_SEED_DEMO_CUSTOMER_NAME:Demo Customer}
  plus-validity-days: ${DEV_SEED_PLUS_VALIDITY_DAYS:365}
  plus-extend-when-days-remain: ${DEV_SEED_PLUS_EXTEND_WHEN_DAYS_REMAIN:30}

auth:
  issuer: ${AUTH_ISSUER:https://auth.snabbit.local}
  jwt-secret: ${JWT_SECRET:local-only-change-me-32-byte-secret}
  google:
    verifier: ${GOOGLE_IDENTITY_VERIFIER:google}
    customer-client-ids: ${GOOGLE_CUSTOMER_CLIENT_IDS:}
    worker-client-ids: ${GOOGLE_WORKER_CLIENT_IDS:}
  otp-pepper: ${OTP_PEPPER:local-only-otp-pepper}
  otp-ttl: PT5M
  request-cooldown: PT1M
  access-token-ttl: PT15M
  refresh-idle-ttl: ${AUTH_REFRESH_IDLE_TTL:P180D}
  refresh-absolute-ttl: ${AUTH_REFRESH_ABSOLUTE_TTL:}
  short-session-absolute-ttl: ${AUTH_SHORT_SESSION_ABSOLUTE_TTL:PT24H}
  refresh-grace-window: ${AUTH_REFRESH_GRACE_WINDOW:PT10S}
  max-active-sessions: ${AUTH_MAX_ACTIVE_SESSIONS:10}
  account-rate-limit: ${AUTH_ACCOUNT_RATE_LIMIT:20}
  account-rate-window: ${AUTH_ACCOUNT_RATE_WINDOW:PT1M}
  max-attempts: 5
  expose-code: ${OTP_EXPOSE_CODE:false}

email-auth:
  sender: ${AUTH_EMAIL_SENDER:smtp}
  from: ${SMTP_FROM:no-reply@localhost}
  code-hmac-secret: ${AUTH_CODE_HMAC_SECRET:local-only-email-code-secret-change-me}
  code-ttl: ${AUTH_CODE_TTL:PT10M}
  code-max-attempts: ${AUTH_CODE_MAX_ATTEMPTS:5}
  resend-cooldown: ${AUTH_CODE_RESEND_COOLDOWN:PT60S}
  max-sends-per-hour: ${AUTH_CODE_MAX_SENDS_PER_HOUR:5}
  terms-version: ${AUTH_TERMS_VERSION:current}
  password-min-length: ${AUTH_PASSWORD_MIN_LENGTH:8}
  password-max-length: ${AUTH_PASSWORD_MAX_LENGTH:128}
  argon2-salt-length: ${AUTH_ARGON2_SALT_LENGTH:16}
  argon2-hash-length: ${AUTH_ARGON2_HASH_LENGTH:32}
  argon2-parallelism: ${AUTH_ARGON2_PARALLELISM:1}
  argon2-memory-kb: ${AUTH_ARGON2_MEMORY_KB:19456}
  argon2-iterations: ${AUTH_ARGON2_ITERATIONS:2}
  bcrypt-strength: ${AUTH_BCRYPT_STRENGTH:12}
  rate-limit-window: ${AUTH_EMAIL_RATE_LIMIT_WINDOW:PT1M}
  rate-limit-per-identity: ${AUTH_EMAIL_RATE_LIMIT_PER_IDENTITY:10}
  rate-limit-per-ip: ${AUTH_EMAIL_RATE_LIMIT_PER_IP:30}
  maximum-delay: ${AUTH_EMAIL_RATE_LIMIT_MAX_DELAY:PT5M}

phone-auth:
  resend-cooldown: ${AUTH_PHONE_RESEND_COOLDOWN:PT30S}
  max-sends-per-hour: ${AUTH_PHONE_MAX_SENDS_PER_HOUR:5}
  max-attempts: ${AUTH_PHONE_MAX_ATTEMPTS:5}
  rate-limit-window: ${AUTH_PHONE_RATE_LIMIT_WINDOW:PT1M}
  rate-limit-per-ip: ${AUTH_PHONE_RATE_LIMIT_PER_IP:30}

otp:
  provider: ${OTP_PROVIDER:twilio-verify}
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  api-key-sid: ${TWILIO_API_KEY_SID:}
  api-key-secret: ${TWILIO_API_KEY_SECRET:}
  verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:}
  expose-code: ${OTP_EXPOSE_CODE:false}

integrations:
  booking-service-url: ${BOOKING_SERVICE_URL:http://localhost:8082}
  wallet-service-url: ${WALLET_SERVICE_URL:http://localhost:8084}
  worker-service-url: ${WORKER_SERVICE_URL:http://localhost:8083}

favourites:
  max-count: ${FAVOURITES_MAX_COUNT:3}
  require-completed-visit: ${FAVOURITES_REQUIRE_COMPLETED_VISIT:true}

service-auth:
  token: ${SERVICE_AUTH_TOKEN:local-only-service-token-change-me-1234567890}

geocoding:
  provider: ${GEOCODING_PROVIDER:disabled}
  base-url: ${GEOCODING_BASE_URL:https://maps.googleapis.com}
  api-key: ${GEOCODING_API_KEY:}
  maximum-mismatch-meters: ${GEOCODING_MAXIMUM_MISMATCH_METERS:250}

user-eventing:
  topic: user-events
  poll-delay: PT1S
  claim-duration: PT30S
  batch-size: 50

deployment.production.required-properties:
  - spring.datasource.url
  - spring.datasource.password
  - spring.data.redis.host
  - spring.kafka.bootstrap-servers
  - auth.issuer
  - auth.jwt-secret
  - auth.google.verifier
  - auth.google.customer-client-ids
  - email-auth.sender
  - email-auth.from
  - email-auth.code-hmac-secret
  - spring.mail.host
  - spring.mail.port
  - spring.mail.username
  - spring.mail.password
  - otp.provider
  - otp.account-sid
  - otp.api-key-sid
  - otp.api-key-secret
  - otp.verify-service-sid
  - integrations.booking-service-url
  - integrations.wallet-service-url
  - integrations.worker-service-url
  - service-auth.token
  - geocoding.provider
  - geocoding.api-key

plus-events:
  consumer-topic: booking-events
  consumer-group: user-service-plus

plus:
  reconciliation-delay: PT1M
  plans:
    monthly:
      price-minor: 19900
      duration-days: 30
      pass-count: 4
      pass-discount-minor: 3000
      service-code: null

plus-purchase-events:
  consumer-topic: wallet-events
  consumer-group: user-service-plus-purchases
