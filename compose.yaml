name: fixing-snabbit

x-postgres-common: &postgres-common
  image: postgres:17-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  user-db:
    <<: *postgres-common
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: ${USER_DB_USERNAME:-snabbit}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in .env}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["user-db-data:/var/lib/postgresql/data"]

  booking-db:
    <<: *postgres-common
    environment:
      POSTGRES_DB: bookings
      POSTGRES_USER: ${BOOKING_DB_USERNAME:-snabbit}
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD:?Set BOOKING_DB_PASSWORD in .env}
    ports: ["127.0.0.1:5434:5432"]
    volumes: ["booking-db-data:/var/lib/postgresql/data"]

  worker-db:
    <<: *postgres-common
    environment:
      POSTGRES_DB: workers
      POSTGRES_USER: ${WORKER_DB_USERNAME:-snabbit}
      POSTGRES_PASSWORD: ${WORKER_DB_PASSWORD:?Set WORKER_DB_PASSWORD in .env}
    ports: ["127.0.0.1:5435:5432"]
    volumes: ["worker-db-data:/var/lib/postgresql/data"]

  wallet-db:
    <<: *postgres-common
    environment:
      POSTGRES_DB: wallets
      POSTGRES_USER: ${WALLET_DB_USERNAME:-snabbit}
      POSTGRES_PASSWORD: ${WALLET_DB_PASSWORD:?Set WALLET_DB_PASSWORD in .env}
    ports: ["127.0.0.1:5436:5432"]
    volumes: ["wallet-db-data:/var/lib/postgresql/data"]

  support-db:
    <<: *postgres-common
    environment:
      POSTGRES_DB: support
      POSTGRES_USER: ${SUPPORT_DB_USERNAME:-snabbit}
      POSTGRES_PASSWORD: ${SUPPORT_DB_PASSWORD:?Set SUPPORT_DB_PASSWORD in .env}
    ports: ["127.0.0.1:5437:5432"]
    volumes: ["support-db-data:/var/lib/postgresql/data"]

  notification-db:
    <<: *postgres-common
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: ${NOTIFICATION_DB_USERNAME:-snabbit}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD in .env}
    ports: ["127.0.0.1:5438:5432"]
    volumes: ["notification-db-data:/var/lib/postgresql/data"]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  kafka:
    image: apache/kafka:4.0.0
    restart: unless-stopped
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

volumes:
  user-db-data:
  booking-db-data:
  worker-db-data:
  wallet-db-data:
  support-db-data:
  notification-db-data:
  redis-data:
