name: fixing-snabbit

x-postgres-common: &postgres-common
  image: postgres:17-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U snabbit"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  user-db:
    <<: *postgres-common
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: snabbit
      POSTGRES_PASSWORD: snabbit-local
    ports: ["5433:5432"]
    volumes: ["user-db-data:/var/lib/postgresql/data"]

  booking-db:
    <<: *postgres-common
    environment:
      POSTGRES_DB: bookings
      POSTGRES_USER: snabbit
      POSTGRES_PASSWORD: snabbit-local
    ports: ["5434:5432"]
    volumes: ["booking-db-data:/var/lib/postgresql/data"]

  worker-db:
    <<: *postgres-common
    environment:
      POSTGRES_DB: workers
      POSTGRES_USER: snabbit
      POSTGRES_PASSWORD: snabbit-local
    ports: ["5435:5432"]
    volumes: ["worker-db-data:/var/lib/postgresql/data"]

  wallet-db:
    <<: *postgres-common
    environment:
      POSTGRES_DB: wallets
      POSTGRES_USER: snabbit
      POSTGRES_PASSWORD: snabbit-local
    ports: ["5436:5432"]
    volumes: ["wallet-db-data:/var/lib/postgresql/data"]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]

  kafka:
    image: apache/kafka:4.0.0
    restart: unless-stopped
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

volumes:
  user-db-data:
  booking-db-data:
  worker-db-data:
  wallet-db-data:
  redis-data:
