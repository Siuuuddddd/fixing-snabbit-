server:
  port: 8084
spring:
  application:
    name: wallet-service
  datasource:
    url: ${WALLET_DB_URL:jdbc:postgresql://localhost:5436/wallets}
    username: ${WALLET_DB_USERNAME:snabbit}
    password: ${WALLET_DB_PASSWORD:snabbit-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true

wallet:
  currency: INR
  reservation-duration: PT5M
  refund-retry-delay: PT1M
  refund-processing-lease: PT5M
  webhook-retry-delay: PT30S
  razorpay:
    mode: ${RAZORPAY_MODE:fake}
    base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com}
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:local-webhook-secret}

eventing:
  outbox-enabled: true
  outbox-topic: wallet-events
  consumer-topic: booking-events
  consumer-group: wallet-service
  outbox-poll-delay: PT1S
  outbox-claim-duration: PT30S
  outbox-batch-size: 50

integrations:
  booking-service-url: ${BOOKING_SERVICE_URL:http://localhost:8082}

service-auth:
  token: ${SERVICE_AUTH_TOKEN:local-only-service-token-change-me-1234567890}
