server:
  port: 8084
spring:
  application:
    name: wallet-service
  datasource:
    url: ${WALLET_DB_URL:jdbc:postgresql://localhost:5436/wallets}
    username: ${WALLET_DB_USERNAME:snabbit}
    password: ${WALLET_DB_PASSWORD:snabbit-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true

wallet:
  currency: INR
  reservation-duration: PT5M
  refund-retry-delay: PT1M
  razorpay:
    mode: ${RAZORPAY_MODE:fake}
    base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com}
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:local-webhook-secret}
